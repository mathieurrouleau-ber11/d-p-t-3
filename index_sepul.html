    body {

    /* 🔥 HEADER */

    .tagline {

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: auto;
    }

    /* CARDS */
    .card {
      position: relative;
  overflow: hidden;
  border-radius: 12px;
  border: 1px solid #5e0000;
  transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      opacity: 0;
      transition: 0.5s;
    }

    .card::after {
      content: "▶";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.7);
  background: #fc0000a4;
  color: black;
  border-radius: 50%;
  padding: 12px 16px;
  font-size: 18px;
  opacity: 0;
  box-shadow: 0 0 15px #fc414181;
  transition: 0.3s;
    }

    .card:hover::before {
      opacity: 1;
    }

    .card:hover::after {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      filter: brightness(0.8) contrast(1.2);
    }

    /* LYRICS */
    .lyrics {
      margin-top: 30px;
      padding: 20px;
      background: #111;
      border: 1px solid #330000;
      border-radius: 10px;
      max-width: 700px;
      margin: auto;
      white-space: pre-line;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
    }

    /* BOUTON */
    #backToTop {
      margin-top: 20px;
      padding: 12px 20px;
      background: linear-gradient(135deg, #ff0000, #ff6600);
      border: none;
      border-radius: 30px;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      display: none;
    }

    #backToTop:hover {
      transform: scale(1.1);
    }

    /* LIEN DISCRET */
    .secret-link {
      position: fixed;
      top: 5px;
      left: 8px;
      color: #aaa;
      font-size: 10px;
      text-decoration: none;
