    body {
      font-family: Arial;
      background: radial-gradient(circle at top, #1e1e2f, #0a0a0f);

      text-align: center;
      margin: 40px;
    }

    .header {
      height: 120px;
      background: linear-gradient(135deg, #ff4e50, #1e90ff);
      border-radius: 20px;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    #backToTop {
      margin-top: 20px;
      padding: 12px 20px;
      background: linear-gradient(135deg, #1db954, #1ed760);
      border: none;
      border-radius: 30px;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      display: none;
      /* caché au début */
    }

    #backToTop:hover {
      transform: scale(1.1);
    }

    .overlay {
      text-align: center;
    }

    .header h1 {
      font-size: 30px;
      margin: 0;
      font-weight: bold;
    }

    .header p {
      margin-top: 10px;
      color: #ddd;
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: auto;
    }

    body::before {
      content: "";
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, #3377c555, transparent);
      top: -100px;
      left: -100px;
      filter: blur(100px);
      z-index: -1;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0;
    }

    .logo span {
      background: linear-gradient(90deg, #1db954, #1ed760, #00c3ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      position: relative;
    }

    /* Effet glow */
    .logo span::after {
      content: "Ça pique";
      position: absolute;
      left: 0;
      top: 0;
      z-index: -1;
      filter: blur(12px);
      opacity: 0.7;
      background: linear-gradient(90deg, #1db954, #00c3ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Sous-titre stylé */
    .tagline {
      margin-top: 10px;
      color: #ccc;
      font-size: 14px;
      letter-spacing: 1px;
      opacity: 0.8;
    }

    .card {
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: 0.5s;
    }

    .card::after {
      content: "▶";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: #1db954;
      color: black;
      border-radius: 50%;
      padding: 12px 16px;
      font-size: 18px;
      opacity: 0;
      transition: 0.3s;
    }

    .card:hover::before {
      opacity: 1;
    }

    .card:hover::after {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }



    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

    .card p {
      margin: 10px;
    }

    .lyrics {
      margin-top: 30px;
      padding: 20px;
      background: #222;
      border-radius: 10px;
      max-width: 700px;
      margin: auto;
      white-space: pre-line;
    }
  </style>
